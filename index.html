<head>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: {
            brand: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              200: '#99F6E4',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
              900: '#134E4A',

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #EEF2F6;
      color: #0F172A;
      overscroll-behavior-y: none;
    }
    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F8FAFC;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    .animate-fade-in { animation: fadeIn 0.18s ease-out; }
    .safe-bottom { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .nav-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tap-btn:active { transform: scale(0.96); }
    .tap-btn { transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease; }
  </style>
</head>
<body>

          <svg class="w-4 h-4 text-amber-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>

      <button type="button" data-tab="hoje" class="nav-btn flex flex-col items-center justify-center gap-1 text-brand-700 font-semibold">

          <span id="navDebtBadge" class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-amber-500 text-white text-[9px] font-bold flex items-center justify-center">0</span>

        <span class="text-[11px]">Ajustes</span>
      </button>
    </nav>

    <!-- Modal Overlay Container -->
    <div id="modalContainer" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-16 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[420px] pointer-events-none flex flex-col gap-2"></div>

    <!-- Hidden File Input for JSON Import -->
    <input type="file" id="importJsonInput" accept="application/json,.json" class="hidden" />
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'dindin_app_v1';

      const DEFAULT_STATE = {
        settings: {
          unitPrice: 3.50,
          pixKey: '07515446200',
          sellerName: '',
          alertTime: '16:00',
          notificationsEnabled: false,
          lastAlertDate: ''
        },
        customers: [],
        transactions: [],
        ui: {
          tab: 'hoje',
          fiadoFilter: 'todos',
          fiadoSearch: '',
          histFilter: 'hoje',
          isSampleData: false
        }
      };

      const FLAVORS = ['Ninho c/ Nutella', 'Maracujá', 'Morango', 'Coco', 'Chocolate', 'Oreo', 'Limão'];

      let state = loadState();
      let clockInterval = null;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredCloneFallback(DEFAULT_STATE);
          const parsed = JSON.parse(raw);
          return {
            settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings || {}),
            customers: Array.isArray(parsed.customers) ? parsed.customers : [],
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            ui: Object.assign({}, DEFAULT_STATE.ui, { isSampleData: !!(parsed.ui && parsed.ui.isSampleData) })
          };
        } catch (e) {
          return structuredCloneFallback(DEFAULT_STATE);
        }
      }

      function structuredCloneFallback(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings: state.settings,
            customers: state.customers,
            transactions: state.transactions,
            ui: { isSampleData: state.ui.isSampleData }
          }));
        } catch (e) {
          // Ignore storage quota / sandbox restrictions gracefully
        }
      }

      function roundMoney(n) {
        const val = Number(n) || 0;
        return Math.round(val * 100) / 100;
      }

      function fmtBRL(n) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(roundMoney(n));
      }

      function uid() {
        return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function todayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function dateISOFromTimestamp(ts) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function fmtTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }

      function fmtShortDate(ts) {
        const d = new Date(ts);
        const today = todayISO();
        const iso = dateISOFromTimestamp(ts);
        if (iso === today) return 'Hoje, ' + fmtTime(ts);
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (iso === dateISOFromTimestamp(yesterday.getTime())) return 'Ontem, ' + fmtTime(ts);
        return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + fmtTime(ts);
      }

      function daysSince(ts) {
        if (!ts) return 0;
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const d = new Date(ts);
        const startOfThatDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        return Math.max(0, Math.round((startOfToday - startOfThatDay) / 86400000));
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function cleanPhone(phone) {
        const digits = String(phone || '').replace(/\D/g, '');
        if (!digits) return '';
        if (digits.length === 10 || digits.length === 11) return '55' + digits;
        return digits;
      }

      // Compute customer ledger from transactions for 100% consistency
      function getCustomerStats() {
        const map = {};
        for (const c of state.customers) {
          map[c.id] = {
            customer: c,
            balance: 0,
            unpaidUnits: 0,
            totalBoughtUnits: 0,
            todayUnits: 0,
            todayDebt: 0,
            oldestUnpaidTs: null,
            lastActivityTs: c.createdAt || 0
          };
        }

        // Process chronologically
        const sorted = [...state.transactions].sort((a, b) => a.timestamp - b.timestamp);
        const today = todayISO();

        for (const tx of sorted) {
          if (!tx.customerId || !map[tx.customerId]) continue;
          const st = map[tx.customerId];
          st.lastActivityTs = Math.max(st.lastActivityTs, tx.timestamp);

          if (tx.type === 'sale_fiado') {
            if (st.balance <= 0.005) {
              st.oldestUnpaidTs = tx.timestamp;
            }
            st.balance = roundMoney(st.balance + tx.amount);
            st.unpaidUnits = roundMoney(st.unpaidUnits + tx.qty);
            st.totalBoughtUnits += tx.qty;
            if (dateISOFromTimestamp(tx.timestamp) === today) {
              st.todayUnits += tx.qty;
              st.todayDebt = roundMoney(st.todayDebt + tx.amount);
            }
          } else if (tx.type === 'sale_cash') {
            st.totalBoughtUnits += tx.qty;
            if (dateISOFromTimestamp(tx.timestamp) === today) {
              st.todayUnits += tx.qty;
            }
          } else if (tx.type === 'payment') {
            st.balance = roundMoney(Math.max(0, st.balance - tx.amount));
            if (st.balance <= 0.005) {
              st.balance = 0;
              st.unpaidUnits = 0;
              st.oldestUnpaidTs = null;
            } else {
              const refPrice = state.settings.unitPrice > 0 ? state.settings.unitPrice : 3.5;
              st.unpaidUnits = Math.max(1, Math.round(st.balance / refPrice));
            }
          }
        }
        return map;
      }

      function getSummaryMetrics() {
        const today = todayISO();
        const now = new Date();
        const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        let soldTodayUnits = 0;
        let soldTodayValue = 0;
        let receivedTodayValue = 0;
        let fiadoTodayUnits = 0;
        let monthUnits = 0;
        let monthValue = 0;
        let monthReceived = 0;

        for (const tx of state.transactions) {
          const iso = dateISOFromTimestamp(tx.timestamp);
          const isToday = iso === today;
          const isMonth = iso.startsWith(currentMonth);

          if (tx.type === 'sale_fiado' || tx.type === 'sale_cash') {
            if (isToday) {
              soldTodayUnits += tx.qty;
              soldTodayValue = roundMoney(soldTodayValue + tx.amount);
              if (tx.type === 'sale_fiado') fiadoTodayUnits += tx.qty;
              if (tx.type === 'sale_cash') receivedTodayValue = roundMoney(receivedTodayValue + tx.amount);
            }
            if (isMonth) {
              monthUnits += tx.qty;
              monthValue = roundMoney(monthValue + tx.amount);
              if (tx.type === 'sale_cash') monthReceived = roundMoney(monthReceived + tx.amount);
            }
          } else if (tx.type === 'payment') {
            if (isToday) receivedTodayValue = roundMoney(receivedTodayValue + tx.amount);
            if (isMonth) monthReceived = roundMoney(monthReceived + tx.amount);
          }
        }

        const cStats = getCustomerStats();
        const debtors = Object.values(cStats)
          .filter(s => s.balance > 0.005)
          .sort((a, b) => b.balance - a.balance);

        const totalPendingValue = roundMoney(debtors.reduce((acc, d) => acc + d.balance, 0));
        const totalPendingUnits = debtors.reduce((acc, d) => acc + Math.round(d.unpaidUnits), 0);

        return {
          soldTodayUnits,
          soldTodayValue,
          receivedTodayValue,
          fiadoTodayUnits,
          monthUnits,
          monthValue,
          monthReceived,
          debtors,
          totalPendingValue,
          totalPendingUnits,
          cStats
        };
      }

      // Toast notifications
      function showToast(message, options = {}) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        const tone = options.tone || 'dark';
        const bgClass = tone === 'success' ? 'bg-brand-800 text-white' :
                        tone === 'amber' ? 'bg-amber-600 text-white' :
                        tone === 'danger' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white';

        el.className = `pointer-events-auto animate-slide-up ${bgClass} px-4 py-3 rounded-2xl shadow-lg flex items-center justify-between gap-3 text-sm font-medium`;
        el.innerHTML = `<span class="leading-snug">${escapeHtml(message)}</span>`;

        if (options.actionLabel && typeof options.onAction === 'function') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'shrink-0 px-2.5 py-1 rounded-lg bg-white/20 hover:bg-white/30 text-white text-xs font-bold uppercase tracking-wide';
          btn.textContent = options.actionLabel;
          btn.addEventListener('click', () => {
            options.onAction();
            el.remove();
          });
          el.appendChild(btn);
        }

        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.2s ease';
          setTimeout(() => el.remove(), 220);
        }, options.duration || 3200);
      }

      function copyToClipboard(text, successMsg) {
        const done = () => showToast(successMsg || 'Copiado!', { tone: 'success' });
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }

      function fallbackCopy(text, cb) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        if (cb) cb();
      }

      function buildBillingMessage(debtorStat) {
        const name = debtorStat.customer.name;
        const units = Math.round(debtorStat.unpaidUnits);
        const total = fmtBRL(debtorStat.balance);
        const pix = state.settings.pixKey || '07515446200';
        const unitLabel = units === 1 ? '1 geladinho' : `${units} geladinhos`;
        return `Oi ${name}! Passando pra lembrar do Din Din 😊\nVocê tem ${unitLabel} em aberto, total de *${total}*.\n\nChave Pix: ${pix}\nValeu!`;
      }

      function openWhatsAppForDebtor(debtorStat) {
        const msg = buildBillingMessage(debtorStat);
        const phone = cleanPhone(debtorStat.customer.phone);
        const url = phone
          ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`
          : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function build16hSummaryText(summary) {
        if (!summary.debtors.length) {
          return `Din Din — Fechamento das ${state.settings.alertTime}: Tudo quitado hoje! Nenhum geladinho pendente.`;
        }
        const lines = [
          `🍧 *Din Din — Cobrança das ${state.settings.alertTime}*`,
          `Faltam pagar: *${summary.totalPendingUnits} geladinho(s)* (${fmtBRL(summary.totalPendingValue)})`,
          ''
        ];
        summary.debtors.forEach((d, i) => {
          const u = Math.round(d.unpaidUnits);
          const tag = d.customer.monthly ? ' [Mensalista]' : '';
          lines.push(`${i + 1}. ${d.customer.name}${tag} — ${u} un. (${fmtBRL(d.balance)})`);
        });
        if (state.settings.pixKey) {
          lines.push('', `Chave Pix: ${state.settings.pixKey}`);
        }
        return lines.join('\n');
      }

      // Actions
      function addQuickSale(customerId, qty = 1) {
        const customer = state.customers.find(c => c.id === customerId);
        if (!customer) return;
        const price = roundMoney(state.settings.unitPrice);
        const tx = {
          id: uid(),
          type: 'sale_fiado',
          customerId: customer.id,
          customerName: customer.name,
          qty: qty,

        const cleanAmount = roundMoney(amount);
        if (cleanAmount <= 0) return;
        const tx = {
          id: uid(),
          type: 'payment',
          customerId: customer.id,
          customerName: customer.name,
          qty: 0,
          unitPrice: 0,
          amount: cleanAmount,
          note: note,
          timestamp: Date.now()
        };
        state.transactions.push(tx);
        saveState();
        render();
        showToast(`Recebido ${fmtBRL(cleanAmount)} de ${customer.name}!`, { tone: 'success' });

      // 16:00 Alert Engine
      function updateClockAndAlert() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const currentHHMM = `${hh}:${mm}`;
        const clockEl = document.getElementById('headerClock');
        if (clockEl) clockEl.textContent = currentHHMM;

        const targetTime = state.settings.alertTime || '16:00';
        const today = todayISO();

        if (currentHHMM === targetTime && state.settings.lastAlertDate !== today) {
          state.settings.lastAlertDate = today;
          saveState();
          trigger16hAlert(false);
        }
      }

      function trigger16hAlert(isManual = false) {
        const summary = getSummaryMetrics();
        if (state.settings.notificationsEnabled && 'Notification' in window && Notification.permission === 'granted') {
          const title = `Din Din — Fechamento das ${state.settings.alertTime}`;
          const body = summary.debtors.length
            ? `Faltam ${summary.totalPendingUnits} geladinho(s) (${fmtBRL(summary.totalPendingValue)}) de ${summary.debtors.length} pessoa(s): ${summary.debtors.slice(0, 4).map(d => d.customer.name).join(', ')}.`
            : 'Tudo pago hoje! Nenhum fiado em aberto.';
          try {
            new Notification(title, { body });
          } catch (e) {}
        }
        open16hModal(isManual);
      }

      function downloadCalendarReminderICS() {
        const [hh, mm] = (state.settings.alertTime || '16:00').split(':');
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const y = now.getFullYear();
        const mo = pad(now.getMonth() + 1);
        const da = pad(now.getDate());
        const dtStart = `${y}${mo}${da}T${pad(hh)}${pad(mm)}00`;
        const endH = pad((parseInt(hh, 10) + 0) % 24);
        const endM = pad(Math.min(59, parseInt(mm, 10) + 10));
        const dtEnd = `${y}${mo}${da}T${endH}${endM}00`;

        const ics = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Din Din//Lembrete Cobranca//PT-BR',
          'BEGIN:VEVENT',
          `UID:dindin-alert-${Date.now()}@dindin.app`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          'RRULE:FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR',
          'SUMMARY:Din Din — Conferir quem falta pagar geladinho',
          'DESCRIPTION:Abrir o app Din Din para ver quantos geladinhos faltam ser pagos e enviar cobrança no WhatsApp.',
          'BEGIN:VALARM',
          'TRIGGER:PT0M',
          'ACTION:DISPLAY',
          'DESCRIPTION:Hora de conferir o fiado no Din Din!',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        downloadFile(ics, 'lembrete-dindin-16h.ics', 'text/calendar;charset=utf-8');
        showToast('Lembrete diário (.ics) baixado! Abra no celular para salvar.', { tone: 'success' });
      }

      function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function renderHistoricoView(summary) {
        const filter = state.ui.histFilter || 'hoje';
        const today = todayISO();
        const now = new Date();
        const weekAgo = now.getTime() - 7 * 86400000;
        const monthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        const filtered = [...state.transactions]
          .filter(tx => {
            const iso = dateISOFromTimestamp(tx.timestamp);
            if (filter === 'hoje') return iso === today;
            if (filter === 'semana') return tx.timestamp >= weekAgo;
            if (filter === 'mes') return iso.startsWith(monthPrefix);
            return true;
          })
          .sort((a, b) => b.timestamp - a.timestamp);

        const totalSoldUnits = filtered.filter(t => t.type !== 'payment').reduce((a, t) => a + t.qty, 0);
        const totalReceived = roundMoney(filtered.filter(t => t.type === 'payment' || t.type === 'sale_cash').reduce((a, t) => a + t.amount, 0));

        return `
          <div>
            <h2 class="text-lg font-extrabold text-slate-900">Histórico & Mês</h2>
            <p class="text-xs text-slate-500">Acompanhe vendas, recebimentos e fechamento mensal</p>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80">
              <div class="text-[11px] font-bold uppercase text-slate-400">Vendidos no mês</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5">${summary.monthUnits} <span class="text-xs font-semibold text-slate-500">un.</span></div>
              <div class="text-xs text-slate-500">${fmtBRL(summary.monthValue)}</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80">
              <div class="text-[11px] font-bold uppercase text-slate-400">Recebido no mês</div>
              <div class="text-xl font-extrabold text-brand-700 mt-0.5">${fmtBRL(summary.monthReceived)}</div>
              <div class="text-xs text-slate-500">Em caixa / Pix</div>
            </div>
          </div>

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            ${[['hoje', 'Hoje'], ['semana', '7 dias'], ['mes', 'Este mês'], ['tudo', 'Tudo']].map(([k, lbl]) => `
              <button type="button" data-hfilter="${k}" class="hist-filter shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${filter === k ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}">${lbl}</button>
            `).join('')}
          </div>

          <div class="flex items-center justify-between text-xs text-slate-500 px-1">
            <span>${filtered.length} registro(s) • ${totalSoldUnits} un. vendidas</span>
            <span class="font-bold text-brand-700">Recebido: ${fmtBRL(totalReceived)}</span>
          </div>

          <div class="space-y-2">
            ${filtered.length === 0 ? `
              <div class="bg-white rounded-2xl border border-slate-200/80 p-6 text-center text-xs text-slate-500">
                Nenhuma movimentação neste período.
              </div>
            ` : filtered.map(tx => {
              const isPay = tx.type === 'payment';
              const isCash = tx.type === 'sale_cash';
              const badgeColor = isPay ? 'bg-emerald-50 text-emerald-700' : isCash ? 'bg-brand-50 text-brand-700' : 'bg-amber-50 text-amber-700';
              const label = isPay ? 'Pagamento' : isCash ? 'Pago na hora' : 'Fiado';
              const sign = isPay || isCash ? '+' : '';
              return `
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="px-1.5 py-0.5 rounded-md ${badgeColor} text-[10px] font-bold">${label}</span>
                      <span class="text-sm font-bold text-slate-900 truncate">${escapeHtml(tx.customerName || 'Avulso')}</span>
                    </div>
                    <div class="text-[11px] text-slate-500 mt-0.5">
                      ${isPay ? (escapeHtml(tx.note || 'Abatimento de fiado')) : `${tx.qty} un. × ${fmtBRL(tx.unitPrice)}${tx.flavor ? ' • ' + escapeHtml(tx.flavor) : ''}`}
                      • ${fmtShortDate(tx.timestamp)}
                    </div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="text-sm font-extrabold ${isPay || isCash ? 'text-emerald-700' : 'text-slate-900'}">${sign}${fmtBRL(tx.amount)}</span>
                    <button type="button" data-del-tx="${tx.id}" class="btn-del-tx w-7 h-7 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center" title="Excluir registro">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderAjustesView() {
        const notifStatus = ('Notification' in window) ? Notification.permission : 'unsupported';
        return `
          <div>
            <h2 class="text-lg font-extrabold text-slate-900">Ajustes do Din Din</h2>
            <p class="text-xs text-slate-500">Preço do geladinho, chave Pix, alerta das 16h e backup</p>
          </div>

          <!-- Preço e Pix -->
          <section class="bg-white rounded-3xl border border-slate-200/80 p-4 space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Preço do Geladinho (R$)</label>
              <div class="flex gap-2">
                <input type="number" step="0.25" min="0.50" id="setPrice" value="${state.settings.unitPrice.toFixed(2)}" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 focus:outline-none text-base font-extrabold" />
                <button type="button" id="btnSavePrice" class="tap-btn px-4 py-2.5 rounded-xl bg-brand-700 text-white text-sm font-bold">Salvar</button>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">Vendas antigas mantêm o preço da época; novas vendas usam o novo valor.</p>
            </div>

            <div class="border-t border-slate-100 pt-4">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Chave Pix para Cobrança</label>
              <div class="flex gap-2">
                <input type="text" id="setPix" value="${escapeHtml(state.settings.pixKey)}" placeholder="CPF, telefone, e-mail ou aleatória" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 focus:outline-none text-sm font-semibold" />
                <button type="button" id="btnSavePix" class="tap-btn px-4 py-2.5 rounded-xl bg-brand-700 text-white text-sm font-bold">Salvar</button>
              </div>
            </div>
          </section>

          <!-- Alerta 16h -->
          <section class="bg-white rounded-3xl border border-slate-200/80 p-4 space-y-3.5">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-sm font-extrabold text-slate-900">Notificação Diária</div>
                <div class="text-xs text-slate-500">Mostra quantos faltam pagar e quem deve</div>
              </div>
              <input type="time" id="setAlertTime" value="${escapeHtml(state.settings.alertTime || '16:00')}" class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-extrabold text-slate-900" />
            </div>

            <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/70">
              <div class="pr-2">
                <div class="text-xs font-bold text-slate-800">Notificação do navegador</div>
                <div class="text-[11px] text-slate-500">${notifStatus === 'granted' ? 'Autorizada neste aparelho' : notifStatus === 'denied' ? 'Bloqueada nas configurações do navegador' : 'Ative para receber alerta na tela'}</div>
              </div>
              <button type="button" id="btnToggleNotif" class="tap-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${state.settings.notificationsEnabled && notifStatus === 'granted' ? 'bg-brand-700 text-white' : 'bg-slate-200 text-slate-700'}">
                ${state.settings.notificationsEnabled && notifStatus === 'granted' ? 'Ativo' : 'Ativar'}
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btnTest16h" class="tap-btn py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold">Testar Alerta 16h</button>
              <button type="button" id="btnDownloadICS" class="tap-btn py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold">Alarme celular (.ics)</button>
            </div>
          </section>

          <!-- Instalar no Celular (PWA) -->
          <section class="bg-white rounded-3xl border border-slate-200/80 p-4 space-y-3">
            <div class="flex items-center gap-3">
              <img src="icons/icon-192.png" alt="Ícone Din Din" class="w-11 h-11 rounded-2xl object-cover shadow-xs ring-1 ring-brand-700/15 shrink-0" />
              <div class="min-w-0">
                <div class="text-sm font-extrabold text-slate-900">Instalar no Celular</div>
                <div class="text-xs text-slate-500" id="pwaStatusText">${isStandaloneApp() ? 'App já instalado neste aparelho ✓' : 'Use como aplicativo nativo no Android ou iPhone'}</div>
              </div>
            </div>
            ${isStandaloneApp() ? `
              <div class="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold text-center">Din Din rodando em modo aplicativo</div>
            ` : `
              <button type="button" id="btnInstallApp" class="tap-btn w-full py-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-xs font-bold shadow-xs">
                ${deferredInstallPrompt ? 'Instalar Din Din agora' : 'Como instalar no Android / iPhone'}
              </button>
            `}
          </section>

          <!-- Backup & Dados -->
          <section class="bg-white rounded-3xl border border-slate-200/80 p-4 space-y-2.5">
            <div class="text-sm font-extrabold text-slate-900 mb-1">Backup & Exportação</div>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btnExportJson" class="tap-btn py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">Salvar Backup (.json)</button>
              <button type="button" id="btnImportJson" class="tap-btn py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">Restaurar Backup</button>
            </div>
            <button type="button" id="btnExportCsv" class="tap-btn w-full py-2.5 rounded-xl bg-brand-50 text-brand-800 border border-brand-200 text-xs font-bold">Exportar planilha de vendas (.csv)</button>
            <button type="button" id="btnResetAll" class="tap-btn w-full py-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold mt-2">Apagar todos os dados</button>
          </section>
        `;
      }

      function render() {
        const summary = getSummaryMetrics();

        // Update header
        const sub = document.getElementById('headerSubtitle');
        const clockText = document.getElementById('headerClock') ? document.getElementById('headerClock').textContent : '--:--';
        sub.innerHTML = `<span>Geladinho ${fmtBRL(state.settings.unitPrice)}</span><span class="text-slate-300">•</span><span id="headerClock">${clockText}</span>`;
        document.getElementById('headerAlertTime').textContent = (state.settings.alertTime || '16:00').replace(':00', 'h');

        const pendingBadge = document.getElementById('headerPendingBadge');
        const navDebtBadge = document.getElementById('navDebtBadge');
        if (summary.debtors.length > 0) {
          pendingBadge.textContent = String(summary.debtors.length);
          pendingBadge.classList.remove('hidden');
          navDebtBadge.textContent = String(summary.debtors.length);
          navDebtBadge.classList.remove('hidden');
        } else {
          pendingBadge.classList.add('hidden');
          navDebtBadge.classList.add('hidden');
        }

        // Update nav active states
        document.querySelectorAll('.nav-btn').forEach(btn => {
          const isActive = btn.getAttribute('data-tab') === state.ui.tab;
          btn.classList.toggle('text-brand-700', isActive);
          btn.classList.toggle('font-semibold', isActive);
          btn.classList.toggle('text-slate-400', !isActive);
          btn.classList.toggle('font-medium', !isActive);
        });

        // Show/hide FAB
        const fab = document.getElementById('fabNewSale');
        if (state.ui.tab === 'hoje' || state.ui.tab === 'fiado') {
          fab.classList.remove('hidden');
        } else {
          fab.classList.add('hidden');
        }

        // Render main content
        const main = document.getElementById('mainContent');
        if (state.ui.tab === 'hoje') {
          main.innerHTML = renderHojeView(summary);
        } else if (state.ui.tab === 'fiado') {
          main.innerHTML = renderFiadoView(summary);
        } else if (state.ui.tab === 'historico') {
          main.innerHTML = renderHistoricoView(summary);
        } else {
          main.innerHTML = renderAjustesView();
        }

        bindDynamicEvents(summary);
      }

      function bindDynamicEvents(summary) {
        const main = document.getElementById('mainContent');

        // Shared debtor card buttons
        main.querySelectorAll('.btn-plus1').forEach(btn => {
          btn.addEventListener('click', () => addQuickSale(btn.getAttribute('data-plus1'), 1));
        });
        main.querySelectorAll('.btn-pay').forEach(btn => {
          btn.addEventListener('click', () => openPaymentModal(btn.getAttribute('data-pay')));
        });
        main.querySelectorAll('.btn-wa').forEach(btn => {
          btn.addEventListener('click', () => {
            const st = summary.cStats[btn.getAttribute('data-wa')];
            if (st) openWhatsAppForDebtor(st);
          });
        });
        main.querySelectorAll('.btn-copy-bill').forEach(btn => {
          btn.addEventListener('click', () => {
            const st = summary.cStats[btn.getAttribute('data-copy-bill')];
            if (st) copyToClipboard(buildBillingMessage(st), `Cobrança de ${st.customer.name} copiada!`);
          });
        });
        main.querySelectorAll('.btn-edit-c').forEach(btn => {
          btn.addEventListener('click', () => openEditCustomerModal(btn.getAttribute('data-edit-c')));
        });

        // Hoje view controls
        const btnCopyPix = main.querySelector('#btnCopyPixQuick');
        if (btnCopyPix) {
          btnCopyPix.addEventListener('click', () => {
            if (state.settings.pixKey) {
              copyToClipboard(state.settings.pixKey, 'Chave Pix copiada!');
            } else {
              state.ui.tab = 'ajustes';
              render();
            }
          });
        }
        const btnOpen16hCard = main.querySelector('#btnOpen16hCard');
        if (btnOpen16hCard) btnOpen16hCard.addEventListener('click', () => open16hModal(true));

        const btnEmptyFirst = main.querySelector('#btnEmptyFirstSale');
        if (btnEmptyFirst) btnEmptyFirst.addEventListener('click', () => openNewSaleModal());

        const btnLoadSample = main.querySelector('#btnLoadSample');
        if (btnLoadSample) btnLoadSample.addEventListener('click', loadSampleData);

        const btnClearSample = main.querySelector('#btnClearSample');
        if (btnClearSample) {
          btnClearSample.addEventListener('click', () => {
            state.customers = [];
            state.transactions = [];
            state.ui.isSampleData = false;
            saveState();
            render();
            showToast('Dados de exemplo limpos! Pronto para uso real.');
          });
        }

        const btnGoFiado = main.querySelector('#btnGoFiado');
        if (btnGoFiado) {
          btnGoFiado.addEventListener('click', () => {
            state.ui.tab = 'fiado';
            render();
          });
        }

        // Fiado view controls
        const searchInp = main.querySelector('#fiadoSearchInput');
        if (searchInp) {
          searchInp.addEventListener('input', (e) => {
            const pos = e.target.selectionStart;
            state.ui.fiadoSearch = e.target.value;
            render();
            const again = document.getElementById('fiadoSearchInput');
            if (again) {
              again.focus();
              again.setSelectionRange(pos, pos);
            }
          });
        }
        main.querySelectorAll('.fiado-filter').forEach(btn => {
          btn.addEventListener('click', () => {
            state.ui.fiadoFilter = btn.getAttribute('data-ffilter');
            render();
          });
        });

        // Historico view controls
        main.querySelectorAll('.hist-filter').forEach(btn => {
          btn.addEventListener('click', () => {
            state.ui.histFilter = btn.getAttribute('data-hfilter');
            render();
          });
        });
        main.querySelectorAll('.btn-del-tx').forEach(btn => {
          btn.addEventListener('click', () => {
            const txId = btn.getAttribute('data-del-tx');
            openConfirmModal(
              'Excluir registro?',
              'O saldo do cliente será recalculado automaticamente.',
              'Excluir',
              () => deleteTransaction(txId)
            );
          });
        });

        // Ajustes view controls
        const btnSavePrice = main.querySelector('#btnSavePrice');
        if (btnSavePrice) {
          btnSavePrice.addEventListener('click', () => {
            const val = parseFloat(String(main.querySelector('#setPrice').value).replace(',', '.'));
            if (!val || val <= 0) { showToast('Informe um preço maior que zero', { tone: 'amber' }); return; }
            state.settings.unitPrice = roundMoney(val);
            saveState();
            render();
            showToast(`Preço atualizado para ${fmtBRL(state.settings.unitPrice)}`, { tone: 'success' });
          });
        }

        const btnSavePix = main.querySelector('#btnSavePix');
        if (btnSavePix) {
          btnSavePix.addEventListener('click', () => {
            state.settings.pixKey = (main.querySelector('#setPix').value || '').trim();
            saveState();
            render();
            showToast('Chave Pix salva!', { tone: 'success' });
          });
        }

        const setAlertTime = main.querySelector('#setAlertTime');
        if (setAlertTime) {
          setAlertTime.addEventListener('change', (e) => {
            state.settings.alertTime = e.target.value || '16:00';
            state.settings.lastAlertDate = '';
            saveState();
            render();
            showToast(`Horário do alerta definido para ${state.settings.alertTime}`, { tone: 'success' });
          });
        }

        const btnToggleNotif = main.querySelector('#btnToggleNotif');
        if (btnToggleNotif) {
          btnToggleNotif.addEventListener('click', () => {
            if (!('Notification' in window)) {
              showToast('Use o botão "Alarme celular (.ics)" para lembretes no aparelho.', { tone: 'amber' });
              return;
            }
            if (Notification.permission === 'granted') {
              state.settings.notificationsEnabled = !state.settings.notificationsEnabled;
              saveState();
              render();
              showToast(state.settings.notificationsEnabled ? 'Notificações ativadas!' : 'Notificações pausadas');
            } else {
              Notification.requestPermission().then(perm => {
                state.settings.notificationsEnabled = (perm === 'granted');
                saveState();
                render();
                showToast(perm === 'granted' ? 'Notificações autorizadas!' : 'Permissão negada no navegador', { tone: perm === 'granted' ? 'success' : 'amber' });
              }).catch(() => {
                showToast('Use o lembrete (.ics) para receber o alerta no celular.', { tone: 'amber' });
              });
            }
          });
        }

        const btnTest16h = main.querySelector('#btnTest16h');
        if (btnTest16h) btnTest16h.addEventListener('click', () => trigger16hAlert(true));

        const btnDownloadICS = main.querySelector('#btnDownloadICS');
        if (btnDownloadICS) btnDownloadICS.addEventListener('click', downloadCalendarReminderICS);

        const btnExportJson = main.querySelector('#btnExportJson');
        if (btnExportJson) {
          btnExportJson.addEventListener('click', () => {
            const payload = JSON.stringify({
              app: 'Din Din',
              exportedAt: new Date().toISOString(),
              settings: state.settings,
              customers: state.customers,
              transactions: state.transactions
            }, null, 2);
            downloadFile(payload, `dindin-backup-${todayISO()}.json`, 'application/json');
            showToast('Backup salvo com sucesso!', { tone: 'success' });
          });
        }

        const btnImportJson = main.querySelector('#btnImportJson');
        if (btnImportJson) {
          btnImportJson.addEventListener('click', () => {
            document.getElementById('importJsonInput').click();
          });
        }

        const btnExportCsv = main.querySelector('#btnExportCsv');
        if (btnExportCsv) {
          btnExportCsv.addEventListener('click', () => {
            const rows = [['Data', 'Hora', 'Tipo', 'Cliente', 'Qtd', 'Unitario', 'Total', 'Sabor/Obs']];
            [...state.transactions].sort((a, b) => a.timestamp - b.timestamp).forEach(t => {
              const d = new Date(t.timestamp);
              rows.push([
                d.toLocaleDateString('pt-BR'),
                fmtTime(t.timestamp),
                t.type === 'payment' ? 'Pagamento' : t.type === 'sale_cash' ? 'Pago na hora' : 'Fiado',
                `"${String(t.customerName || '').replace(/"/g, '""')}"`,
                t.qty,
                t.unitPrice.toFixed(2).replace('.', ','),
                t.amount.toFixed(2).replace('.', ','),
                `"${String(t.flavor || t.note || '').replace(/"/g, '""')}"`
              ]);
            });
            const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
            downloadFile(csv, `dindin-vendas-${todayISO()}.csv`, 'text/csv;charset=utf-8');
            showToast('Planilha CSV exportada!', { tone: 'success' });
          });
        }

        const btnInstallApp = main.querySelector('#btnInstallApp');
        if (btnInstallApp) {
          btnInstallApp.addEventListener('click', handleInstallClick);
        }

        const btnResetAll = main.querySelector('#btnResetAll');
        if (btnResetAll) {
          btnResetAll.addEventListener('click', () => {
            openConfirmModal(
              'Apagar todos os dados?',
              'Isso vai remover todos os clientes e o histórico de vendas. O preço e a chave Pix serão mantidos.',
              'Apagar tudo',
              () => {
                state.customers = [];
                state.transactions = [];
                state.ui.isSampleData = false;
                saveState();
                render();
                showToast('Todos os registros foram apagados');
              }
            );
          });
        }
      }

      // Global static listeners
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.tab = btn.getAttribute('data-tab');
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      });

      document.getElementById('fabNewSale').addEventListener('click', () => openNewSaleModal());
      document.getElementById('btnHeaderAlert').addEventListener('click', () => open16hModal(true));

      document.getElementById('importJsonInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || '{}'));
            if (!Array.isArray(parsed.customers) || !Array.isArray(parsed.transactions)) {
              throw new Error('Formato inválido');
            }
            state.settings = Object.assign({}, state.settings, parsed.settings || {});
            state.customers = parsed.customers;
            state.transactions = parsed.transactions;
            state.ui.isSampleData = false;
            saveState();
            render();
            showToast('Backup restaurado com sucesso!', { tone: 'success' });
          } catch (err) {
            showToast('Arquivo de backup inválido', { tone: 'danger' });
          }
          e.target.value = '';
        };
        reader.readAsText(file);
      });

      // PWA Install Helpers (Android & iOS)
      let deferredInstallPrompt = null;

      function isStandaloneApp() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      }

      function isIOSDevice() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }

      function openInstallGuideModal() {
        const ios = isIOSDevice();
        openModal(`
          <div class="w-full max-w-[420px] bg-white rounded-t-3xl sm:rounded-3xl p-5 animate-slide-up shadow-2xl">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2.5">
                <img src="icons/icon-192.png" alt="Din Din" class="w-10 h-10 rounded-2xl object-cover shadow-xs" />
                <div>
                  <h2 class="text-base font-extrabold text-slate-900">Instalar o Din Din</h2>
                  <p class="text-xs text-slate-500">Fica com ícone na tela inicial do celular</p>
                </div>
              </div>
              <button type="button" id="mCloseInstall" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="space-y-2.5 text-xs text-slate-700 mb-4">
              <div class="p-3 rounded-2xl ${ios ? 'bg-brand-50 border border-brand-200' : 'bg-slate-50 border border-slate-200'}">
                <div class="font-extrabold text-slate-900 mb-1">No iPhone (Safari)</div>
                <ol class="list-decimal list-inside space-y-1">
                  <li>Abra o link do Netlify no <strong>Safari</strong>.</li>
                  <li>Toque no botão <strong>Compartilhar</strong> (quadrado com seta para cima).</li>
                  <li>Toque em <strong>Adicionar à Tela de Início</strong> e confirme em <strong>Adicionar</strong>.</li>
                </ol>
              </div>
              <div class="p-3 rounded-2xl ${!ios ? 'bg-brand-50 border border-brand-200' : 'bg-slate-50 border border-slate-200'}">
                <div class="font-extrabold text-slate-900 mb-1">No Android (Chrome)</div>
                <ol class="list-decimal list-inside space-y-1">
                  <li>Abra o link do Netlify no <strong>Google Chrome</strong>.</li>
                  <li>Toque no menu <strong>⋮</strong> no canto superior direito.</li>
                  <li>Toque em <strong>Instalar aplicativo</strong> (ou <strong>Adicionar à tela inicial</strong>).</li>
                </ol>
              </div>
            </div>
            <button type="button" id="mOkInstall" class="tap-btn w-full py-3 rounded-2xl bg-brand-700 text-white font-bold text-sm">Entendi</button>
          </div>
        `, (mc) => {
          mc.querySelector('#mCloseInstall').addEventListener('click', closeModal);
          mc.querySelector('#mOkInstall').addEventListener('click', closeModal);
        });
      }

      function handleInstallClick() {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          deferredInstallPrompt.userChoice.then((choice) => {
            if (choice && choice.outcome === 'accepted') {
              showToast('Din Din instalado na tela inicial!', { tone: 'success' });
            }
            deferredInstallPrompt = null;
            render();
          }).catch(() => openInstallGuideModal());
        } else {
          openInstallGuideModal();
        }
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        if (state.ui.tab === 'ajustes') render();
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        showToast('Din Din instalado com sucesso!', { tone: 'success' });
        render();
      });

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }

      // Init
      render();
      updateClockAndAlert();
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = setInterval(updateClockAndAlert, 15000);
    })();
  </script>
</body>
</html>
